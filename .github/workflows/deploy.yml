# data/*.yaml 등을 수정해 main 브랜치에 올리면 자동으로 사이트를 다시 만들고 배포합니다.
name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매주 월요일 오전 9시(KST) 인용수 갱신을 위해 자동 재배포
  schedule:
    - cron: "0 0 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/fetch_citations.py || true
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
