{% extends "base.html" %}
{% block content %}
<section class="block"><div class="wrap narrow">
  <ul class="news-list">{% for v in achievements.youtube %}
    <li><div>{% if v.url %}<a href="{{ v.url }}" target="_blank" rel="noopener">▶ {{ v.title }}</a>{% else %}{{ v.title }}{% endif %}</div></li>
  {% endfor %}</ul>
</div></section>
{% endblock %}
