{% extends "base.html" %}
{% block content %}
<section class="block"><div class="wrap narrow">
  <ul class="news-list">{% for v in achievements.youtube %}
    <li><div>{% if v.url %}<a href="{{ v.url }}" target="_blank" rel="noopener">▶ {{ v.title }}</a>{% else %}{{ v.title }}{% endif %}{% set v = (v.url)|yt_id %}{% if v %}<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/{{ v }}" title="YouTube video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>{% endif %}</div></li>
  {% endfor %}</ul>
</div></section>
{% endblock %}
