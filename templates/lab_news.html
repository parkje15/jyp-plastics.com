{% extends "base.html" %}
{% block content %}
<section class="block"><div class="wrap narrow">
  <ul class="news-list">{% for n in lab_news %}
    <li><time>{{ n.date }}</time><div>{{ n.text }}{% if n.url %} <a href="{{ n.url }}" target="_blank" rel="noopener">↗</a>{% endif %}</div></li>
  {% endfor %}</ul>
</div></section>
{% endblock %}
