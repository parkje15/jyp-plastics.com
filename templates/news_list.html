{% extends "base.html" %}
{% block content %}
<section class="block"><div class="wrap narrow">
  <ul class="news-list">{% for n in items %}
    <li><time>{{ n.date }}</time><div><a href="{{ n.url }}" target="_blank" rel="noopener">{{ n.title }}</a>{% if n.url2 %} · <a href="{{ n.url2 }}" target="_blank" rel="noopener">ACS ↗</a>{% endif %}{% set v = (n.url)|yt_id %}{% if v %}<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/{{ v }}" title="YouTube video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>{% endif %}</div></li>
  {% endfor %}</ul>
</div></section>
{% endblock %}
