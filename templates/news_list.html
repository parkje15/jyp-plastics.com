{% extends "base.html" %}
{% block content %}
<section class="block"><div class="wrap narrow">
  <ul class="news-list">{% for n in items %}
    <li><time>{{ n.date }}</time><div><a href="{{ n.url }}" target="_blank" rel="noopener">{{ n.title }}</a>{% if n.url2 %} · <a href="{{ n.url2 }}" target="_blank" rel="noopener">ACS ↗</a>{% endif %}</div></li>
  {% endfor %}</ul>
</div></section>
{% endblock %}
